<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة المناهج التعليمية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; }
        :focus-visible { outline: 3px solid #4338ca; outline-offset: 2px; }
        .fade-in { animation: fadeIn .25s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px);} to { opacity: 1; transform: translateY(0);} }
        @media (prefers-reduced-motion: reduce) { .fade-in { animation: none; } }
    </style>
</head>

<button onclick="closeVideo()" class="absolute top-2 left-2 z-10 bg-white/90 rounded-full w-8 h-8 flex items-center justify-center text-lg font-bold">✕</button>

</div>
