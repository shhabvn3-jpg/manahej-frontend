justify-between max-w-5xl mx-auto mb-6"> <button id="back-btn-2" onclick="showSubjects()" class="text-indigo-700 font-bold hover:underline"><span id="back-label-2">→ رجوع للمواد</span></button> <h3 id="foundation-title" class="text-xl font-bold text-slate-800"></h3><span class="w-16"></span></div> <div id="foundation-container" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 max-w-5xl mx-auto" role="group"></div> </section> </main> <footer class="bg-slate-900 text-slate-400 py-6 text-center text-sm"><p id="footer-text">جميع الحقوق محفوظة © 2026 - منصة المناهج التعليمية الشاملة</p></footer> <script> const subjectSets = { core: ["arabic","math","science","english","socialStudies","islamic","arts","pe"], senior: ["arabic","math","physics","chemistry","biology","english","socialStudies","islamic","computer","history"] }; const countries = { jo:{emoji:"🇯🇴",subjects:subjectSets}, sy:{emoji:"🇸🇾",subjects:subjectSets}, ps:{emoji:"🇵🇸",subjects:subjectSets}, all:{emoji:"🌐",subjects:subjectSets} }; const subjectMeta = { arabic:{icon:"📖",ar:"اللغة العربية",en:"Arabic",fr:"Arabe"}, math:{icon:"🔢",ar:"الرياضيات",en:"Mathematics",fr:"Mathématiques"}, science:{icon:"🔬",ar:"العلوم",en:"Science",fr:"Sciences"}, physics:{icon:"⚛️",ar:"الفيزياء",en:"Physics",fr:"Physique"}, chemistry:{icon:"🧪",ar:"الكيمياء",en:"Chemistry",fr:"Chimie"}, biology:{icon:"🧬",ar:"الأحياء",en:"Biology",fr:"Biologie"}, english:{icon:"🔤",ar:"اللغة الإنجليزية",en:"English",fr:"Anglais"}, socialStudies:{icon:"🌍",ar:"الدراسات الاجتماعية",en:"Social Studies",fr:"Études sociales"}, islamic:{icon:"🕌",ar:"التربية الإسلامية",en:"Islamic Education",fr:"Éducation islamique"}, arts:{icon:"🎨",ar:"التربية الفنية",en:"Arts",fr:"Arts"}, pe:{icon:"⚽",ar:"التربية الرياضية",en:"Physical Education",fr:"Éducation physique"}, computer:{icon:"💻",ar:"الحاسوب",en:"Computer",fr:"Informatique"}, history:{icon:"🏺",ar:"تاريخ الأردن",en:"Jordan History",fr:"Histoire de Jordanie"}, foundationArabic:{icon:"📖",ar:"اللغة العربية",e  link: "https://www.youtube.com/watch?v=9wVJk0ATEII" }, { teacher: "محمد العيساوي", link: "https://www.youtube.com/channel/UCm8BfOnJRRxtCOO2RThv9Yg" }], computer: [{ teacher: "ربيع الفتياني", link: "https://www.youtube.com/channel/UCFOry4O_FlI2HU5epQnDWPQ" }], history: [{ teacher: "شادي النجار", link: "https://www.youtube.com/@shadinajjar6285" }, { teacher: "محمد الكوفحي", link: "https://www.youtube.com/channel/UCo2f9HiagjY4013qO4lr_Vg" }, { teacher: "محمد البطران", link: "https://www.youtube.com/@MohmmadBatran" }, { teacher: "محمد النجار", link: "https://www.youtube.com/@Najjar_history" }, { teacher: "أحمد أبو الصادق", link: "https://www.youtube.com/watch?v=mNvfvA6QkQs" }, { teacher: "حسين مسالمة", link: "https://www.youtube.com/watch?v=Ghz0B1ThjUY" }] } }; const foundationResources = { foundationArabic: [{ teacher: "محمد محروس", link: "https://www.youtube.com/c/mahrous" }], foundationIslamic: [{ teacher: "أحمد أبو لعسل", link: "https://www.youtube.com/@mohammad_abu_asal" }], foundationHistory: [{ teacher: "محمود بني عطا", link: "https://www.youtube.com/channel/UC-O6XyixFHqNnAaflyA8V7w" }], foundationMath: [{ teacher: "فخري جرار", link: "https://www.youtube.com/@FJmath" }, { teacher: "محمد نجار", link: "https://www.youtube.com/channel/UCNmxtZAPnYMPwMbfrWB0HAg" }] };
const translations = { ar:{dir:"rtl",navTitle:"🎓 منصة المناهج التعليمية",curriculumTitle:"اختر المنهاج الدراسي",curriculumDesc:"حدد الدولة لعرض الصفوف والمواد المعتمدة",countryNames:{jo:"المنهاج الأردني",sy:"المنهاج السوري",ps:"المنهاج الفلسطيني",all:"باقي المناهج"},gradeTitle:"اختر الصف الدراسي (١ - ١٢)",viewSubjects:"عرض المواد ←",backLabel:"→ رجوع للصفوف",backLabel2:"→ رجوع للمواد",foundationTitle:"تأسيس المواد الوزارية",fieldTitle:"اختر الفرع الأكاديمي",fieldAcademic:"أكاديمي",fieldBitc:"BITC",comingSoon:"قريباً",subjectsTitleFor:(g)=>`مواد ${g}`,footer:"جميع الحقوق محفوظة © 2026 - منصة المناهج التعليمية الشاملة",grades:["الصف الأول","الصف الثاني","الصف الثالث","الصف الرابع","الصف الخامس","الصف السادس","الصف السابع","الصف الثامن","الصف التاسع","الصف العاشر","الحادي عشر","الثاني عشر"]}, en:{dir:"ltr",navTitle:"🎓 Educational Curricula Platform",curriculumTitle:"Select Curriculum",curriculumDesc:"Choose a country to view available grades and subjects",countryNames:{jo:"Jordanian Curriculum",sy:"Syrian Curriculum",ps:"Palestinian Curriculum",all:"Other Curricula"},gradeTitle:"Select Grade Level (1 - 12)",viewSubjects:"View Subjects →",backLabel:"← Back to grades",backLabel2:"← Back to subjects",foundationTitle:"Ministerial Subjects Foundation",fieldTitle:"Select Academic Field",fieldAcademic:"Academic",fieldBitc:"BITC",comingSoon:"Coming soon",subjectsTitleFor:(g)=>`${g} subjects`,footer:"All rights reserved © 2026 - Educational Curricula Platform",grades:["Grade 1","Grade 2","Grade 3","Grade 4","Grade 5","Grade 6","Grade 7","Grade 8","Grade 9","Grade 10","Grade 11","Grade 12"]}, fr:{dir:"ltr",navTitle:"🎓 Plateforme des Programmes Éducatifs",curriculumTitle:"Sélectionnez le Programme",curriculumDesc:"Choisissez un pays pour voir les classes et matières",countryNames:{jo:"Programme Jordanien",sy:"Programme Syrien",ps:"Programme Palestinien",all:"Autres Programmes"},gradeTitle:"Sélectionnez le Niveau (1 - 12)",viewSubjects:"Voir les matières →",backLabel:"← Retour aux btn=document.createElement('button'); btn.type='button'; btn.id=`btn-${code}`; btn.className=`country-btn p-4 rounded-xl border-2 font-bold text-lg transition shadow-sm ${isActive?'border-indigo-600 bg-indigo-50':'border-slate-200 bg-white hover:border-indigo-300'}`; btn.onclick=()=>selectCountry(code); btn.innerHTML=`${countries[code].emoji} <span>${tr.countryNames[code]}</span>`; c.appendChild(btn); }); } function renderGrades(){ const c=document.getElementById('grades-container'); const tr=t(); c.innerHTML=''; tr.grades.forEach((grade,index)=>{ const card=document.createElement('button'); card.type='button'; card.className='bg-white border border-slate-200 rounded-xl p-5 text-center shadow-sm hover:shadow-md hover:border-indigo-500 cursor-pointer transition flex flex-col justify-between items-center group'; card.onclick=()=>openGrade(index); card.innerHTML=`<span class="text-3xl font-black text-indigo-600 mb-2">${index+1}</span><span class="font-bold text-slate-700 text-sm md:text-base">${grade}</span><span class="text-xs text-indigo-500 mt-3">${tr.viewSubjects}</span>`; c.appendChild(card); }); } function getEmbedUrl(link){ const v=link.match(/[?&]v=([^&]+)/); if(v) return 'https://www.youtube.com/embed/'+v[1]; const s=link.match(/youtu\.be\/([^?&]+)/); if(s) return 'https://www.youtube.com/embed/'+s[1]; const p=link.match(/[?&]list=([^&]+)/); if(p) return 'https://www.youtube.com/embed/videoseries?list='+p[1]; return null; } function openVideo(embedUrl){document.getElementById('video-iframe').src=embedUrl; document.getElementById('video-modal').classList.remove('hidden');} function closeVideo(){document.getElementById('video-modal').classList.add('hidden'); document.getElementById('video-iframe').src='';} function teacherLinkHtml(r){ const embed=getEmbedUrl(r.link); if(embed) return `<button type="button" onclick="openVideo('${embed}')" class="text-xs text-indigo-600 hover:underline flex items-center gap-1">▶️ ${r.teacher}</button>`; return `<a href="${r.link}" target="_blank" rel="noopener noreferrer" class="text-xs text-indigo-600 hover:underline flex items-center gap-1">👤 ${r.teacher}</a>`; } function renderSubjects(){ const tr=t(); const grade=tr.grades[selectedGradeIndex]; document.getElementById('subjects-title').innerText=tr.subjectsTitleFor(grade); const isSenior=selectedGradeIndex>=10, isGrade12=selectedGradeIndex===11; const gradeNumber = String(selectedGradeIndex + 1); const setKey=isSenior?'senior':'core'; const keys=countries[selectedCountry].subjects[setKey].slice(); const c=document.getElementById('subjects-container'); c.innerHTML=''; keys.forEach((key)=>{ const meta=subjectMeta[key]; const resources = subjectResources[gradeNumber] && subjectResources[gradeNumber][key]; if(resources && resources.length){ const card=document.createElement('div'); card.className='bg-white border-2 border-indigo-300 rounded-xl p-4 text-center shadow-sm hover:shadow-md transition flex flex-col items-center gap-2'; const teacherLinks = resources.map(teacherLinkHtml).join(''); card.innerHTML=`<span class="text-3xl">${meta.icon}</span><span class="font-bold text-slate-700 text-sm md:text-base">${meta[currentLang]}</span><div class="flex flex-col gap-1 mt-1">${teacherLinks}</div>`; c.appendChild(card); } else { const card=document.createElement('div'); card.className='bg-white border border-slate-200 rounded-xl p-4 text-center shadow-sm flex flex-col items-center gap-2'; card.innerHTML=`<span class="text-3xl">${meta.icon}</span><span class="font-bold text-slate-700 text-sm md:text-base">${meta[currentLang]}</span>`; c.appendChild(card); } }); if(isGrade12){ const meta=subjectMeta.foundation; const card=document.createElement('button'); card.type='button'; card.onclick=()=>openFoundation(); card.className='bg-indigo-50 border-2 border-indigo-300 rounded-xl p-4 text-center shadow-sm hover:shadow-md hover:border-indigo-500 transition flex flex-col items-center gap-2 cursor-pointer'; card.innerHTML=`<span class="text-3xl">${meta.icon}</span><span class="font-bold text-indigo-700 text-sm md:text-base">${meta[currentLang]}</span>`; c.appendChild(card); } } function renderFoundation(){ const keys=['foundationArabic','foundationIslamic','foundationHistory','foundationMath']; const c=document.getElementById('foundation-container'); c.innerHTML=''; keys.forEach((key)=>{ const meta=subjectMeta[key]; const resources=foundationResources[key]; const card=document.createElement('div'); card.className='bg-white border-2 border-indigo-300 rounded-xl p-4 text-center shadow-sm hover:shadow-md transition flex flex-col items-center gap-2'; const teacherLinks=(resources||[]).map(teacherLinkHtml).join(''); card.innerHTML=`<span class="text-3xl">${meta.icon}</span><span class="font-bold text-slate-700 text-sm md:text-base">${meta[currentLang]}</span><div class="flex flex-col gap-1 mt-1">${teacherLinks}</div>`; c.appendChild(card); }); } function selectCountry(code){selectedCountry=code; renderCountries(); if(selectedGradeIndex!==null) renderSubjects();} function hideAllViews(){['view-country','view-grades','view-field','view-subjects','view-foundation'].forEach((id)=>{document.getElementById(id).classList.add('hidden');});} function renderFields(){ const tr=t(); const c=document.getElementById('fields-container'); c.innerHTML=''; const a=document.createElement('button'); a.type='button'; a.onclick=()=>selectField('academic'); a.className='bg-white border-2 border-indigo-600 bg-indigo-50 rounded-xl p-6 text-center shadow-sm hover:shadow-md transition flex flex-col items-center gap-2 cursor-pointer'; a.innerHTML=`<span class="text-3xl">🎓</span><span class="font-bold text-indigo-700 text-base">${tr.fieldAcademic}</span>`; c.appendChild(a); const b=document.createElement('div'); b.className='bg-slate-100 border-2 border-slate-200 rounded-xl p-6 text-center flex flex-col items-center gap-2 opacity-60 cursor-not-allowed'; b.innerHTML=`<span class="text-3xl">🔧</span><span class="font-bold text-slate-500 text-base">${tr.fieldBitc}</span><span class="text-xs text-slate-400">${tr.comingSoon}</span>`; c.appendChild(b); } function selectField(field){selectedField=field; renderSubjects(); hideAllViews(); document.getElementById('view-subjects').classList.remove('hidden');} function openGrade(index){ selectedGradeIndex=index; hideAllViews(); if(index>=10){renderFields(); document.getElementById('view-field').classList.remove('hidden');} else{renderSubjects(); document.getElementById('view-subjects').classList.remove('hidden');} } function showGrades(){selectedGradeIndex=null; selectedField=null; hideAllViews(); document.getElementById('view-country').classList.remove('hidden'); document.getElementById('view-grades').classList.remove('hidden');} function openFoundation(){renderFoundation(); hideAllViews(); document.getElementById('view-foundation').classList.remove('hidden');} function showSubjects(){hideAllViews(); document.getElementById('view-subjects').classList.remove('hidden');} function backFromSubjects(){ if(selectedGradeIndex>=10){hideAllViews(); renderFields(); document.getElementById('view-field').classList.remove('hidden');} else{showGrades();} } renderCountries(); renderGrades(); </script> </body> </html>
